<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="vn.sparc.esca.AppManager1"/>
    <allow send_destination="vn.sparc.esca.AppManager1"/>
    <allow receive_sender="vn.sparc.esca.AppManager1"/>
  </policy>

  <!-- Launching and closing applications is privileged: a rogue client could
       otherwise kill the dashboard. The launcher runs as weston; put it in the
       appmanager group rather than handing out root. -->
  <policy group="appmanager">
    <allow send_destination="vn.sparc.esca.AppManager1"/>
    <allow receive_sender="vn.sparc.esca.AppManager1"/>
  </policy>

  <policy context="default">
    <deny own="vn.sparc.esca.AppManager1"/>
    <deny send_destination="vn.sparc.esca.AppManager1"/>
  </policy>
</busconfig>
